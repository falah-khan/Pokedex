<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <!-- favIcon -->
    <link id="favIcon" rel="shortcut icon" href="" type="image/x-icon">

    <!-- fontawesome link -->
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css'

<body>
    <!-- nav start -->
    <nav
        class="block transition-all duration-1000 w-full max-w-screen-lg px-4 py-2 mx-auto bg-white shadow-2xl shadow-neutral-800 rounded-xl md:px-8 md:py-3 mt-5">
        <div class="container flex flex-wrap items-center justify-between mx-auto text-slate-800">
            <a href="index.html" class="flex items-center space-x-3 rtl:space-x-reverse">
                <img src="https://archives.bulbagarden.net/media/upload/4/4b/Pok%C3%A9dex_logo.png" class="h-7"
                    alt="Pokedex Logo" />
            </a>
            <div class="hidden md:block">
                <ul class="flex flex-col gap-2 mt-2 mb-4 md:mb-0 md:mt-0 md:flex-row md:items-center md:gap-6">
                    <li
                        class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration-300 hover:text-red-500 hover:-translate-y-1">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-6 h-6">
                            <circle cx="50" cy="50" r="48" fill="#000000" stroke="#000000" stroke-width="2" />
                            <path d="M 50,5 A 45,45 0 0,1 95,50 L 5,50 A 45,45 0 0,1 50,5 Z" fill="#FF1C1C" />
                            <path d="M 5,50 A 45,45 0 0,0 95,50 L 50,50 Z" fill="#FFFFFF" />
                            <line x1="4" y1="50" x2="96" y2="50" stroke="#000000" stroke-width="6" />
                            <circle cx="50" cy="50" r="14" fill="#000000" />
                            <circle cx="50" cy="50" r="9" fill="#FFFFFF" />
                            <circle cx="50" cy="50" r="6" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1" />
                        </svg>
                        <a href="./blank.html" class="flex items-center">
                            Pokemons
                        </a>
                    </li>
                    <li
                        class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration- hover:text-red-500 hover:-translate-y-1">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <a href="./blank.html" class="flex items-center">
                            Search
                        </a>
                    </li>
                    <li
                        class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration-300 hover:text-red-500 hover:-translate-y-1">
                        <i class="fa-solid fa-scale-balanced"></i> <a href="./blank.html" class="flex items-center">
                            Compare
                        </a>
                    </li>
                    <li
                        class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration-300 hover:text-red-500 hover:-translate-y-1">
                        <i class="fa-regular fa-circle-user text-base"></i>
                        <a href="./blank.html" class="flex items-center">
                            About
                        </a>
                    </li>
                </ul>
            </div>
            <button
                class="relative ml-auto p-4 h-6 max-h-[40px] w-6 max-w-[40px] select-none rounded-lg text-center align-middle text-xs font-medium uppercase text-inherit transition-all hover:shadow-md focus:bg-transparent active:bg-transparent disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none md:hidden duration-150 hover:text-red-500 focus:text-red-500 focus:shadow-md"
                type="button">
                <span class="absolute transform -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">
                    <i class="fa-solid fa-bars font-bold text-2xl w-6 h-6 "></i>
                </span>
            </button>
        </div>
    </nav>
