<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <!-- favIcon -->
    <link id="favIcon" rel="shortcut icon" href="" type="image/x-icon">

    <!-- fontawesome link -->
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css'
        integrity='sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=='
        crossorigin='anonymous' referrerpolicy='no-referrer'>

    <!-- jquery link -->
    <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js'
        integrity='sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=='
        crossorigin='anonymous' referrerpolicy='no-referrer'></script>

    <!-- tailwind link -->
    <script src='https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4'></script>

</head>

<body class="bg-[url('../images/bodyBackground.avif')]">
    <!-- nav start -->
    <header
        class="block transition-all duration-1000 w-full max-w-screen-lg px-4 py-2 mx-auto bg-white shadow-2xl shadow-neutral-600 rounded-xl md:px-8 md:py-3 mt-5">
        <nav class="container flex flex-wrap md:items-center justify-between mx-auto text-slate-800">
            <div class="flex flex-col md:gap-0 gap-3 md:flex-row justify-between md:container">
                <a href="index.html" class="flex items-center space-x-3 rtl:space-x-reverse">
                    <img src="https://archives.bulbagarden.net/media/upload/4/4b/Pok%C3%A9dex_logo.png" class="h-7"
                        alt="Pokedex Logo" />
                </a>
                <div id="navLinks"
                    class="max-h-0 opacity-0 overflow-hidden transition-all duration-700 md:max-h-none md:opacity-100 md:overflow-visible">
                    <ul class="flex flex-col gap-2 mt-2 mb-4 md:mb-0 md:mt-0 md:flex-row text-center md:gap-6">
                        <li
                            class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration-300 hover:text-red-600 hover:-translate-y-1">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-6 h-6">
                                <circle cx="50" cy="50" r="48" fill="#000000" stroke="#000000" stroke-width="2" />
                                <path d="M 50,5 A 45,45 0 0,1 95,50 L 5,50 A 45,45 0 0,1 50,5 Z" fill="#FF1C1C" />
                                <path d="M 5,50 A 45,45 0 0,0 95,50 L 50,50 Z" fill="#FFFFFF" />
                                <line x1="4" y1="50" x2="96" y2="50" stroke="#000000" stroke-width="6" />
                                <circle cx="50" cy="50" r="14" fill="#000000" />
                                <circle cx="50" cy="50" r="9" fill="#FFFFFF" />
                                <circle cx="50" cy="50" r="6" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1" />
                            </svg>
                            <a href="#" class="flex items-center">
                                Pokemons
                            </a>
                        </li>
                        <li
                            class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration- hover:text-red-600 hover:-translate-y-1">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <a href="#" class="flex items-center">
                                Search
                            </a>
                        </li>
                        <li
                            class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration-300 hover:text-red-600 hover:-translate-y-1">
                            <i class="fa-solid fa-scale-balanced"></i> <a href="#" class="flex items-center">
                                Compare
                            </a>
                        </li>
                        <li
                            class="flex items-center p-1 text-sm gap-x-2 text-slate-600 transition-all duration-300 hover:text-red-600 hover:-translate-y-1">
                            <i class="fa-regular fa-circle-user text-base"></i>
                            <a href="#" class="flex items-center">
                                About
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
            <button
                class="relative ml-auto p-4 h-6 max-h-[40px] w-6 max-w-[40px] select-none rounded-lg text-center align-middle text-xs font-medium uppercase text-inherit transition-all hover:shadow-md focus:bg-transparent active:bg-transparent disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none md:hidden duration-200 hover:text-red-600 focus:text-red-600 focus:shadow-md"
                type="button" id="menuIcon">
                <span class="absolute transform -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2">
                    <i class="fa-solid fa-bars font-bold text-2xl w-6 h-6 "></i>
                </span>
            </button>
        </nav>
    </header>
    <!-- nav end -->

    <!-- Hero start -->
    <main class="block w-full max-w-screen-lg px-4 py-2 mx-auto bg-white rounded-xl md:px-8 md:py-3 mt-16">
        <section id="Search" class="w-full flex flex-row justify-between">
                <div class="relative inline-flex  rounded-lg p-1 flex-row items-center gap-3  border-2 border-slate-600">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="w-5 h-5 inline-block">
                        <circle cx="50" cy="50" r="48" fill="#000000" stroke="#000000" stroke-width="2" />
                        <path d="M 50,5 A 45,45 0 0,1 95,50 L 5,50 A 45,45 0 0,1 50,5 Z" fill="#FF1C1C" />
                        <path d="M 5,50 A 45,45 0 0,0 95,50 L 50,50 Z" fill="#FFFFFF" />
                        <line x1="4" y1="50" x2="96" y2="50" stroke="#000000" stroke-width="6" />
                        <circle cx="50" cy="50" r="14" fill="#000000" />
                        <circle cx="50" cy="50" r="9" fill="#FFFFFF" />
                        <circle cx="50" cy="50" r="6" fill="#FFFFFF" stroke="#DCDCDC" stroke-width="1" />
                    </svg>
                    <input type="text" id="Search" placeholder="Search pokemon" autocorrect="off"   
                        class="inline mt-0.5 rounded pe-10 p-1 border-none focus:placeholder:text-red-600 focus:outline-none" />

                        <button type="button" aria-label="Submit"
                            class="rounded-full p-2 text-slate-600 transition-colors hover:bg-gray-100 focus:bg-gray-100">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </button>
                </div>
                <div class="bg-red-600 text-white text-xl rounded-xl p-3 font-bold">
                    <p>Search for a Pokémon by it's name or National Pokédex number.</p>
                </div>
        </section>
    </main>
    <!-- Hero end -->
</body>

<!-- script.js -->
<script src="/Pokedex/js/script.js"></script>

</html>
